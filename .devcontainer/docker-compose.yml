# Single-service setup, no inter-container networking needed. Podman disallows
# combining --userns with --pod, and podman-compose pods services by default,
# so disable pod creation to let userns_mode: keep-id (below) work.
x-podman:
  in_pod: false

services:
  devcontainer:
    build:
      context: .
      dockerfile: Dockerfile
    # Map host UID <-> container UID 1:1 (rootless Podman default otherwise
    # maps the host user to container root, leaving the bind-mounted
    # /workspace unwritable by the non-root vscode user)
    userns_mode: "keep-id"
    volumes:
      # Mount the workspace folder
      - ..:/workspace:cached
      # Keep command history
      - devcontainer-bashhistory:/commandhistory
      # Mount podman socket for podman-in-podman (rootless)
      - /run/user/1000/podman/podman.sock:/var/run/docker-host.sock
      # Mount host git config for git user identity
      - ${HOME}/.gitconfig:/home/vscode/.gitconfig:ro
      # Mount host SSH keys/known_hosts for git push over SSH (read-only, so
      # github.com must already be in the host's known_hosts)
      - ${HOME}/.ssh:/home/vscode/.ssh:ro
    ports:
      # Long-form syntax: podman-compose's `docker compose config` output passes
      # short-form ports through as plain strings, which Zed's devcontainer
      # support can't deserialize (expects the structured long form).
      - target: 5000
        published: "5001" # avoid host port 5000 conflict
      - target: 8000
        published: "8000"
      - target: 8080
        published: "8080"
    # No-op PID 1 to keep the container alive. Devcontainers start without a
    # TTY, so an interactive shell here would read EOF and exit immediately.
    # Editor/exec terminals are separate sessions and don't use this command.
    command: sleep infinity
    # Set working directory
    working_dir: /workspace
    # Environment variables
    environment:
      - PYTHONPATH=/workspace

volumes:
  devcontainer-bashhistory:
